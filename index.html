<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>해커톤 작품 갤러리</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: #f5f6f8; color: #222; line-height: 1.6;
    }
    button { font-family: inherit; }

    /* ===== 첫 화면: 인트로 (해커톤 안내 글자 비) ===== */
    #intro-screen {
      position: fixed; inset: 0; z-index: 50;
      background: #000; color: #0f0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; overflow: hidden;
    }
    #rain {
      position: absolute; inset: 0; width: 100%; height: 100%;
      opacity: .55;
    }
    .intro-content { position: relative; z-index: 2; padding: 24px; }
    .intro-title {
      font-size: clamp(2.2rem, 9vw, 4rem); font-weight: 800;
      color: #d2ffd2; letter-spacing: .08em;
      text-shadow: 0 0 12px #0f0, 0 0 40px #0a0;
      animation: glow 2.4s ease-in-out infinite alternate;
    }
    .intro-sub {
      margin-top: 10px; font-size: clamp(.95rem, 4vw, 1.15rem);
      color: #8f8; opacity: .9; letter-spacing: .3em;
    }
    .intro-sub2 {
      margin-top: 4px; font-size: clamp(.8rem, 3.4vw, .95rem);
      opacity: .75; letter-spacing: .2em;
    }
    @keyframes glow {
      from { text-shadow: 0 0 8px #0f0, 0 0 24px #0a0; }
      to   { text-shadow: 0 0 18px #4f4, 0 0 60px #0c0; }
    }
    .big-btn {
      margin-top: 36px; padding: 16px 44px;
      font-size: 1.1rem; font-weight: 700; color: #001600;
      background: #21d921; border: none; border-radius: 999px;
      cursor: pointer; box-shadow: 0 0 18px rgba(33,217,33,.65);
    }
    .big-btn:active { transform: scale(.96); }
    #intro-screen.hidden, #carousel-screen.hidden { display: none; }

    /* ===== 우측 상단 통통 튀는 "해커톤이란?" 말풍선 ===== */
    #helpBubble {
      position: fixed; top: 8px; right: 8px; z-index: 60;
      padding: 11px 18px; border: none; border-radius: 999px;
      background: #21d921; color: #001600;
      font-size: .92rem; font-weight: 800; letter-spacing: .02em;
      box-shadow: 0 4px 14px rgba(33,217,33,.55), 0 0 0 3px rgba(255,255,255,.85);
      cursor: pointer;
      animation: bubble-bounce 1.7s ease-in-out infinite;
    }
    @keyframes bubble-bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      22%      { transform: translateY(-10px) scale(1.04); }
      40%      { transform: translateY(0) scale(1); }
      55%      { transform: translateY(-5px) scale(1.02); }
      70%      { transform: translateY(0) scale(1); }
    }
    #helpBubble:active { transform: scale(.94); }

    /* ===== 갤러리에서 첫 화면으로 돌아가는 버튼 ===== */
    #homeBtn {
      position: fixed; top: 8px; left: 8px; z-index: 60;
      display: none;
      padding: 11px 18px; border-radius: 999px;
      border: 1px solid #d0d3dd; background: rgba(255,255,255,.96);
      color: #333; font-size: .92rem; font-weight: 700;
      box-shadow: 0 2px 10px rgba(0,0,0,.14); cursor: pointer;
    }
    #homeBtn.show { display: block; }
    #homeBtn:active { transform: scale(.96); }

    /* ===== 배경 음악 재생/음소거 버튼 (우하단, 기존 상단 버튼과 겹치지 않음) ===== */
    #musicBtn {
      position: fixed; right: 12px; bottom: 12px; z-index: 80;
      width: 46px; height: 46px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.35);
      background: rgba(10,20,14,.72); color: #b9f5cf;
      font-size: 1.2rem; line-height: 1; cursor: pointer;
      box-shadow: 0 2px 10px rgba(0,0,0,.35);
    }
    #musicBtn:active { transform: scale(.94); }
    #musicBtn.attn { border-color: #5eea90; animation: btnPulse 1.6s ease-in-out infinite; }
    @keyframes btnPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(94,234,144,.55); }
      50%      { box-shadow: 0 0 0 9px rgba(94,234,144,0); }
    }

    /* ===== 음악 안내 말풍선 (재생 전 / 재생이 막혔을 때 표시) ===== */
    #musicHint {
      position: fixed; right: 12px; bottom: 68px; z-index: 80;
      padding: 9px 15px; border-radius: 999px;
      border: 1px solid rgba(185,245,207,.45);
      background: rgba(10,20,14,.88); color: #b9f5cf;
      font-size: .88rem; font-weight: 700;
      box-shadow: 0 2px 10px rgba(0,0,0,.35);
      display: none; pointer-events: none; white-space: nowrap;
      animation: hintPulse 1.6s ease-in-out infinite;
    }
    #musicHint.show { display: block; }
    @keyframes hintPulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }

    /* ===== 설명 캐러셀 (팝업) : 배경은 매트릭스 글자 비 ===== */
    #carousel-screen {
      position: fixed; inset: 0; z-index: 70;
      background: linear-gradient(160deg, #020604, #04180c 60%, #06210f);
      color: #eef2f8;
      display: flex; flex-direction: column;
    }
    #carRain {
      position: absolute; inset: 0; width: 100%; height: 100%;
      z-index: 0; opacity: .5;
    }
    .car-close {
      position: absolute; top: 12px; right: 12px; z-index: 3;
      width: 42px; height: 42px; border-radius: 50%;
      border: 1px solid #1f5138; background: #0a2417; color: #b9f5cf;
      font-size: 1.15rem; line-height: 1; cursor: pointer;
    }
    .slides-wrap {
      flex: 1; overflow: hidden; position: relative; z-index: 1;
      touch-action: pan-y;
    }
    .slides-track {
      display: flex; height: 100%;
      transition: transform .35s ease;
    }
    .slide {
      min-width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 24px 28px;
      overflow-y: auto;
    }
    .slide-emoji { font-size: 3rem; margin-bottom: 18px; }
    .slide h2 {
      font-size: clamp(1.65rem, 6vw, 2.25rem); margin-bottom: 16px;
      color: #86f7b0;
      text-shadow: 0 0 14px rgba(94,234,144,.35);
    }
    .slide p {
      max-width: 560px; font-size: clamp(1.23rem, 4.2vw, 1.37rem);
      color: #d5e9dc; white-space: pre-line;
    }
    .car-ui { position: relative; z-index: 1; padding: 12px 20px 26px; text-align: center; }
    .dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
    .dots span {
      width: 8px; height: 8px; border-radius: 50%;
      background: #1f5138; transition: background .2s;
    }
    .dots span.on { background: #5eea90; }
    .car-nav { display: flex; gap: 10px; justify-content: center; }
    .car-nav button {
      padding: 13px 26px; border-radius: 999px; font-size: 1rem;
      font-weight: 700; cursor: pointer; border: 1px solid #1f5138;
      background: #0a2417; color: #b9f5cf;
    }
    .car-nav button.primary {
      background: #21d921; border-color: #21d921; color: #001600;
      box-shadow: 0 0 14px rgba(33,217,33,.5);
    }
    .car-nav button:disabled { opacity: .35; cursor: default; }

    /* ===== 캐러셀 슬라이드 글자 모션 ===== */
    /* JS가 글자를 하나씩 span.ch로 쪼개고 --d 만큼 늦게 재생합니다 */
    .ch { display: inline-block; white-space: pre; }

    /* 1번째 슬라이드: 글자가 위에서 통통 튀며 차례로 낙하 */
    .anim-fall.play .slide-emoji { animation: emDrop .7s cubic-bezier(.22,1.6,.36,1) both; }
    @keyframes emDrop {
      0%   { opacity: 0; transform: translateY(-90px) scale(1.8) rotate(-20deg); }
      55%  { opacity: 1; transform: translateY(10px) scale(.92) rotate(6deg); }
      78%  { transform: translateY(-4px) scale(1.05) rotate(-2deg); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
    }
    .anim-fall.play .ch {
      animation: charFall .62s cubic-bezier(.25,1.5,.4,1) both;
      animation-delay: var(--d, 0s);
    }
    @keyframes charFall {
      0%   { opacity: 0; transform: translateY(-1.7em) rotate(-18deg) scale(1.7); text-shadow: 0 0 22px rgba(134,247,176,.95); }
      55%  { opacity: 1; transform: translateY(.14em) rotate(6deg) scale(.93); }
      78%  { transform: translateY(-.05em) rotate(-2deg) scale(1.04); text-shadow: 0 0 8px rgba(134,247,176,.45); }
      100% { opacity: 1; transform: translateY(0) rotate(0) scale(1); text-shadow: 0 0 0 rgba(134,247,176,0); }
    }

    /* 2번째 슬라이드: 글자가 팡팡 튀듯 차례로 팝 */
    .anim-pop.play .slide-emoji { animation: emPop .5s cubic-bezier(.3,1.8,.5,1) both; }
    @keyframes emPop {
      0%   { opacity: 0; transform: scale(0) rotate(-30deg); }
      60%  { opacity: 1; transform: scale(1.35) rotate(8deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }
    .anim-pop.play .ch {
      animation: charPop .5s cubic-bezier(.3,1.9,.45,1) both;
      animation-delay: var(--d, 0s);
    }
    @keyframes charPop {
      0%   { opacity: 0; transform: scale(0) rotate(14deg); text-shadow: 0 0 24px rgba(134,247,176,.95); }
      55%  { opacity: 1; transform: scale(1.4) rotate(-5deg); }
      78%  { transform: scale(.9) rotate(2deg); text-shadow: 0 0 8px rgba(134,247,176,.5); }
      100% { opacity: 1; transform: scale(1) rotate(0); text-shadow: 0 0 0 rgba(134,247,176,0); }
    }

    /* 3번째 슬라이드: 타자기 (글자 입력은 JS, 여기선 깜빡이는 커서만) */
    .anim-type.play .slide-emoji { animation: popIn .3s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes popIn {
      from { opacity: 0; transform: scale(.5); }
      to   { opacity: 1; transform: scale(1); }
    }
    .anim-type .typing::after {
      content: ''; display: inline-block;
      width: 2px; height: 1em; margin-left: 3px;
      background: #5eea90; vertical-align: -0.12em;
      animation: caretBlink .7s steps(1) infinite;
    }
    @keyframes caretBlink { 50% { opacity: 0; } }

    /* ===== 갤러리 ===== */
    header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff; padding: 58px 20px 22px; text-align: center;
    }
    header h1 { font-size: 1.5rem; margin-bottom: 6px; }
    header p { font-size: .95rem; opacity: .92; white-space: pre-line; }
    .season-bar {
      display: flex; gap: 8px; flex-wrap: wrap;
      justify-content: center; padding: 12px 16px 0;
    }
    .season-bar button {
      border: 1px solid #d0d3dd; background: #fff;
      border-radius: 999px; padding: 6px 14px;
      font-size: .85rem; cursor: pointer;
    }
    .season-bar button.on { background: #4f46e5; color: #fff; border-color: #4f46e5; }
    main {
      max-width: 720px; margin: 0 auto; padding: 16px;
      display: grid; gap: 12px; grid-template-columns: 1fr 1fr;
    }
    .card {
      background: #fff; border-radius: 14px; overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      display: flex; flex-direction: column;
    }
    .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #e9ebf0; }
    .card .body { padding: 12px 12px 14px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .team { font-size: .8rem; font-weight: 700; color: #4f46e5; }
    .title { font-size: 1rem; font-weight: 700; }
    .desc { font-size: .9rem; color: #555; flex: 1; white-space: pre-line; }
    .view {
      display: inline-block; margin-top: 8px; text-align: center;
      background: #111827; color: #fff !important; text-decoration: none;
      border-radius: 8px; padding: 9px 8px; font-size: .85rem; font-weight: 600;
    }
    .card.pending { border: 1.5px dashed #c9cedb; box-shadow: none; }
    .card.pending .title { color: #8a90a0; }
    .card.pending .desc { color: #9aa0ab; }
    .empty { text-align: center; color: #888; padding: 40px 0; grid-column: 1 / -1; }
    footer { text-align: center; color: #9aa0ab; font-size: .78rem; padding: 24px 0 32px; }

    @media (prefers-reduced-motion: reduce) {
      .intro-title { animation: none; }
      .slides-track { transition: none; }
      #helpBubble { animation: none; }
      .slide.play .slide-emoji, .slide.play h2, .slide.play p, .slide.play .ch { animation: none; }
    }
  </style>
</head>
<body>
  <!-- 첫 화면: 해커톤 안내 인트로 (글자가 비처럼 떨어짐) -->
  <div id="intro-screen" role="dialog" aria-label="해커톤 안내 첫 화면">
    <canvas id="rain" aria-hidden="true"></canvas>
    <div class="intro-content">
      <div class="intro-title">1st SCH Hackathon</div>
      <div class="intro-sub">2026.10.24 토요일</div>
      <div class="intro-sub intro-sub2">컴퓨터실 · 09:00-17:00</div>
      <button class="big-btn" id="enterBtn">갤러리 입장하기</button>
    </div>
  </div>

  <!-- 우측 상단: 통통 튀는 설명서 말풍선 (어디서나 누를 수 있음) -->
  <button id="helpBubble" aria-label="해커톤이란? 설명 보기">해커톤이란?</button>

  <!-- 갤러리 → 첫 화면으로 돌아가는 버튼 -->
  <button id="homeBtn" aria-label="처음 화면으로 돌아가기">← 처음으로</button>

  <!-- 우하단: 배경 음악 켜기/끄기 -->
  <button id="musicBtn" aria-label="배경 음악 켜기/끄기" aria-pressed="true" title="배경 음악">🎵</button>
  <div id="musicHint" role="status">🎵 탭하면 음악이 나와요</div>
  <audio id="bgmAudio" loop preload="auto"></audio>

  <!-- 해커톤 설명 캐러셀 (팝업) : 배경에 매트릭스 글자 비 -->
  <div id="carousel-screen" class="hidden" role="dialog" aria-label="해커톤 소개">
    <canvas id="carRain" aria-hidden="true"></canvas>
    <button class="car-close" id="carClose" aria-label="닫기">✕</button>
    <div class="slides-wrap" id="slidesWrap">
      <div class="slides-track" id="slidesTrack"></div>
    </div>
    <div class="car-ui">
      <div class="dots" id="dots"></div>
      <div class="car-nav">
        <button id="prevBtn">이전</button>
        <button id="nextBtn" class="primary">다음</button>
      </div>
    </div>
  </div>

  <!-- 갤러리 -->
  <header>
    <h1>해커톤 작품 갤러리</h1>
    <p id="intro">불러오는 중...</p>
  </header>
  <div class="season-bar" id="seasonBar"></div>
  <main id="gallery"></main>
  <footer>작품에 학생 실명·얼굴 등 개인정보는 게시하지 않습니다.</footer>

  <script>
    // ============================================
    // 설정: Apps Script 웹앱 배포 주소(/exec)를 붙여넣으세요.
    // 예) 'https://script.google.com/macros/s/AKfy.../exec'
    // 갤러리 작품 목록만 시트에서 읽습니다.
    // 첫 화면(인트로)은 시트와 상관없이 항상 바로 뜹니다.
    // ============================================
    const API_URL = 'https://script.google.com/macros/s/AKfycbwyEWi_dVdG9rmWCZq3urU3vmrW32if-pVa16WncZUPCGMm0t8TXo2JUZtRjTGfeqLlnA/exec';

    // 첫 화면에 비처럼 떨어지는 글자들: 해커톤 안내 문구
    // (다음 회차에는 여기 단어와 위쪽 제목·날짜·장소만 바꾸면 됩니다)
    const RAIN_WORDS = [
      '해커톤', 'HACKATHON', '2026.10.24', '토요일', '컴퓨터실',
      '09:00-17:00', '만들기', '코딩', '상상', '도전', '아이디어', '팀워크'
    ];
    const RAIN_GLYPHS = 'アイウエオカキクケコサシスセソタチツテト0123456789';

    // 시트 '설명' 탭: 제목|내용을 한 줄에 한 장씩 적으면 기본 슬라이드 대신 그 내용이 나옵니다.
    const DEFAULT_SLIDES = [
      { emoji: '💡', title: '해커톤이 뭐예요?',
        body: '해커톤은 정해진 시간 안에\n팀이 힘을 합쳐 아이디어를\n직접 만들어 보는 축제예요.\n\n코딩 대회가 아니라\n"만드는 즐거움"을 나누는 자리입니다.' },
      { emoji: '🛠️', title: '이렇게 진행돼요',
        body: '1. 주제와 규칙을 함께 확인해요\n2. 모둠별로 만들 것을 정해요\n3. 상상하던 것을 직접 만들어요\n4. 완성품을 모두 앞에서 소개해요\n\n일시: 2026.10.24 토요일 09:00-17:00\n장소: 컴퓨터실' },
      { emoji: '🚀', title: '여러분도 할 수 있어요',
        body: '못해도 괜찮아요.\n해커톤의 진짜 상은\n"내가 직접 만들었다"는 경험이에요.\n\n완성된 작품은 이 갤러리에 전시돼요.\n여러분의 첫 작품을 기대할게요!' }
    ];

    let data = null;
    let cbSeq = 0;
    const reduceMotion = window.matchMedia &&
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;',
        '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    /* ---------- 화면 전환 ---------- */
    const introScreen = document.getElementById('intro-screen');
    const carouselScreen = document.getElementById('carousel-screen');
    const homeBtn = document.getElementById('homeBtn');

    function introVisible() { return !introScreen.classList.contains('hidden'); }
    function carouselVisible() { return !carouselScreen.classList.contains('hidden'); }

    function goGallery() {
      stopRain();
      stopCarRain();
      stopTypewriter();
      introScreen.classList.add('hidden');
      carouselScreen.classList.add('hidden');
      homeBtn.classList.add('show');
      window.scrollTo(0, 0);
    }
    function goHome() {
      stopCarRain();
      carouselScreen.classList.add('hidden');
      homeBtn.classList.remove('show');
      introScreen.classList.remove('hidden');
      startRain();
      window.scrollTo(0, 0);
    }
    function openCarousel() {
      stopRain();
      buildCarousel();
      carouselScreen.classList.remove('hidden');
      startCarRain();
    }
    function closeCarousel() {
      stopTypewriter();
      stopCarRain();
      carouselScreen.classList.add('hidden');
      if (introVisible()) startRain();
    }

    document.getElementById('enterBtn').addEventListener('click', goGallery);
    document.getElementById('helpBubble').addEventListener('click', openCarousel);
    homeBtn.addEventListener('click', goHome);
    document.getElementById('carClose').addEventListener('click', closeCarousel);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && carouselVisible()) closeCarousel();
    });

    /* ---------- 첫 화면: 안내 글자 비 ---------- */
    let rafId = null;
    const canvas = document.getElementById('rain');
    const ctx = canvas.getContext('2d');
    let columns = [], fontSize = 16, lastDraw = 0;

    function newColumn() {
      return {
        y: Math.floor(Math.random() * -30),
        // 35%는 안내 단어가 세로로 반복해서 흐르고, 나머지는 무작위 글자
        word: Math.random() < 0.35
          ? RAIN_WORDS[Math.floor(Math.random() * RAIN_WORDS.length)]
          : null
      };
    }
    function resizeRain() {
      canvas.width = introScreen.clientWidth || window.innerWidth;
      canvas.height = introScreen.clientHeight || window.innerHeight;
      fontSize = Math.max(14, Math.floor(canvas.width / 28));
      const count = Math.ceil(canvas.width / fontSize);
      columns = Array.from({ length: count }, newColumn);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    function drawRain(ts) {
      rafId = requestAnimationFrame(drawRain);
      if (ts - lastDraw < 66) return;   // 약 15fps: 배터리 부담 ↓
      lastDraw = ts;
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = fontSize + 'px monospace';
      for (let i = 0; i < columns.length; i++) {
        const col = columns[i];
        let ch;
        if (col.word) {
          const L = col.word.length;
          ch = col.word[((col.y % L) + L) % L];
        } else {
          ch = RAIN_GLYPHS[Math.floor(Math.random() * RAIN_GLYPHS.length)];
        }
        ctx.fillStyle = Math.random() < 0.06 ? '#b6ffb6' : '#0b3';
        ctx.fillText(ch, i * fontSize, col.y * fontSize);
        if (col.y * fontSize > canvas.height && Math.random() > 0.985) {
          columns[i] = newColumn();
          columns[i].y = 0;
        }
        col.y++;
      }
    }
    function startRain() {
      if (reduceMotion || rafId || !introVisible()) return;
      resizeRain();
      rafId = requestAnimationFrame(drawRain);
    }
    function stopRain() {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
    }

    /* ---------- 캐러셀 배경: 매트릭스 글자 비 ---------- */
    const carCanvas = document.getElementById('carRain');
    const carCtx = carCanvas.getContext('2d');
    let carRaf = null, carCols = [], carFont = 15, carLast = 0;

    function resizeCarRain() {
      carCanvas.width = carouselScreen.clientWidth || window.innerWidth;
      carCanvas.height = carouselScreen.clientHeight || window.innerHeight;
      carFont = Math.max(13, Math.floor(carCanvas.width / 22));
      const count = Math.ceil(carCanvas.width / carFont);
      carCols = Array.from({ length: count }, () =>
        Math.floor(Math.random() * (carCanvas.height / carFont + 40)) - 40);
      carCtx.fillStyle = '#020604';
      carCtx.fillRect(0, 0, carCanvas.width, carCanvas.height);
    }
    function drawCarRain(ts) {
      carRaf = requestAnimationFrame(drawCarRain);
      if (ts - carLast < 55) return;   // 약 18fps
      carLast = ts;
      carCtx.fillStyle = 'rgba(2,6,4,0.11)';
      carCtx.fillRect(0, 0, carCanvas.width, carCanvas.height);
      carCtx.font = carFont + 'px monospace';
      for (let i = 0; i < carCols.length; i++) {
        const ch = RAIN_GLYPHS[Math.floor(Math.random() * RAIN_GLYPHS.length)];
        carCtx.fillStyle = Math.random() < 0.08 ? '#c8ffd8' : '#0c4';
        carCtx.fillText(ch, i * carFont, carCols[i] * carFont);
        if (carCols[i] * carFont > carCanvas.height && Math.random() > 0.982) {
          carCols[i] = Math.floor(Math.random() * -20);
        }
        carCols[i]++;
      }
    }
    function startCarRain() {
      if (reduceMotion || carRaf || !carouselVisible()) return;
      resizeCarRain();
      carRaf = requestAnimationFrame(drawCarRain);
    }
    function stopCarRain() {
      if (carRaf) cancelAnimationFrame(carRaf);
      carRaf = null;
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { stopRain(); stopCarRain(); }
      else if (carouselVisible()) startCarRain();
      else if (introVisible()) startRain();
    });
    window.addEventListener('resize', () => {
      if (rafId) resizeRain();
      if (carRaf) resizeCarRain();
    });
    startRain();

    /* ---------- 설명 캐러셀 ---------- */
    let slideIndex = 0;
    let slideCount = 0;

    function getSlides() {
      return (data && data.slides && data.slides.length)
        ? data.slides : DEFAULT_SLIDES;
    }

    function buildCarousel() {
      const slides = getSlides();
      slideCount = slides.length;
      const track = document.getElementById('slidesTrack');
      track.innerHTML = slides.map((s, i) =>
        '<div class="slide ' + SLIDE_ANIMS[i % SLIDE_ANIMS.length] + '">' +
          (s.emoji ? '<div class="slide-emoji">' + esc(s.emoji) + '</div>' : '') +
          '<h2 data-full="' + esc(s.title) + '">' + esc(s.title) + '</h2>' +
          '<p data-full="' + esc(s.body) + '">' + esc(s.body) + '</p>' +
        '</div>'
      ).join('');
      document.getElementById('dots').innerHTML =
        slides.map((_, i) => '<span data-i="' + i + '"></span>').join('');
      document.querySelectorAll('#dots span').forEach(d =>
        d.addEventListener('click', () => showSlide(+d.dataset.i)));
      showSlide(0);
    }

    function showSlide(i) {
      slideIndex = Math.max(0, Math.min(i, slideCount - 1));
      document.getElementById('slidesTrack').style.transform =
        'translateX(-' + (slideIndex * 100) + '%)';
      document.querySelectorAll('#dots span').forEach((d, j) =>
        d.classList.toggle('on', j === slideIndex));
      document.getElementById('prevBtn').disabled = (slideIndex === 0);
      const last = (slideIndex === slideCount - 1);
      // 갤러리에서 연 경우엔 "돌아가기", 첫 화면에서 연 경우엔 "갤러리 입장하기"
      document.getElementById('nextBtn').textContent = !last ? '다음'
        : (introVisible() ? '갤러리 입장하기' : '돌아가기');
      playSlideAnim(slideIndex);
    }

    /* ---------- 슬라이드 글자 모션 ---------- */
    // 슬라이드마다 다른 효과: 1번째 글자 낙하, 2번째 글자 팝, 3번째 타자기 (순환)
    const SLIDE_ANIMS = ['anim-fall', 'anim-pop', 'anim-type'];
    let typeTimer = null;

    function stopTypewriter() {
      if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
      document.querySelectorAll('#slidesTrack .typing').forEach(el =>
        el.classList.remove('typing'));
    }

    // 글자 하나하나를 span.ch로 쪼개고, 순서대로 --d 지연을 줍니다.
    // 줄바꿈(\n)은 그대로 두어 pre-line 줄바꿈이 유지되게 합니다.
    function splitChars(el, baseDelay, step) {
      const text = el.dataset.full || el.textContent;
      el.dataset.full = text;
      el.textContent = '';
      let i = 0;
      for (const ch of Array.from(text)) {
        if (ch === '\n') { el.appendChild(document.createTextNode('\n')); continue; }
        const s = document.createElement('span');
        s.className = 'ch';
        s.textContent = ch;
        s.style.setProperty('--d', (baseDelay + i * step).toFixed(3) + 's');
        el.appendChild(s);
        i++;
      }
    }

    // 슬라이드가 보일 때마다 효과를 처음부터 다시 재생
    function playSlideAnim(i) {
      stopTypewriter();
      const track = document.getElementById('slidesTrack');
      const slide = track.children[i];
      if (!slide) return;
      Array.from(track.children).forEach(s => s.classList.remove('play'));
      // 효과 도중에 나갔던 슬라이드는 원문부터 복구
      slide.querySelectorAll('[data-full]').forEach(el => {
        el.textContent = el.dataset.full;
      });
      if (reduceMotion) { slide.classList.add('play'); return; }
      // 1·2번째 슬라이드는 글자를 쪼개서 하나씩 튀게 재생
      if (slide.classList.contains('anim-fall') || slide.classList.contains('anim-pop')) {
        const h2 = slide.querySelector('h2');
        const p = slide.querySelector('p');
        if (h2) splitChars(h2, 0.08, 0.05);
        if (p) splitChars(p, 0.6, 0.015);
      }
      void slide.offsetWidth;  // 리플로우로 CSS 애니메이션 재시작
      slide.classList.add('play');
      if (slide.classList.contains('anim-type')) startTypewriter(slide);
    }

    // 3번째 슬라이드: 타자기처럼 한 글자씩 다다다닥
    function startTypewriter(slide) {
      const targets = [slide.querySelector('h2'), slide.querySelector('p')]
        .filter(Boolean);
      if (!targets.length) return;
      const queue = targets.map(el => ({
        el, chars: Array.from(el.dataset.full || el.textContent)
      }));
      queue.forEach(t => { t.el.textContent = ''; });
      let ti = 0, ci = 0;
      queue[0].el.classList.add('typing');
      typeTimer = setInterval(() => {
        const t = queue[ti];
        t.el.textContent += t.chars[ci++];
        if (ci >= t.chars.length) {
          t.el.classList.remove('typing');
          ti++; ci = 0;
          if (ti >= queue.length) {
            clearInterval(typeTimer); typeTimer = null; return;
          }
          queue[ti].el.classList.add('typing');
        }
      }, 40);
    }

    document.getElementById('prevBtn').addEventListener('click', () => showSlide(slideIndex - 1));
    document.getElementById('nextBtn').addEventListener('click', () => {
      if (slideIndex >= slideCount - 1) goGallery();
      else showSlide(slideIndex + 1);
    });

    // 스와이프
    (function () {
      const wrap = document.getElementById('slidesWrap');
      let startX = null;
      wrap.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
      wrap.addEventListener('touchend', e => {
        if (startX === null) return;
        const dx = e.changedTouches[0].clientX - startX;
        startX = null;
        if (dx <= -40) {
          if (slideIndex >= slideCount - 1) goGallery();
          else showSlide(slideIndex + 1);
        } else if (dx >= 40) {
          showSlide(slideIndex - 1);
        }
      }, { passive: true });
    })();

    /* ---------- 갤러리 ---------- */
    // Apps Script 웹앱을 JSONP로 호출합니다 (도메인이 달라도 동작).
    function fetchGallery(season, onDone) {
      const cbName = '__galleryCb' + (++cbSeq);
      const s = document.createElement('script');
      let settled = false;
      function cleanup() {
        try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
        if (s.parentNode) s.parentNode.removeChild(s);
      }
      window[cbName] = function (res) {
        settled = true;
        cleanup();
        onDone(null, res);
      };
      s.onerror = function () {
        if (settled) return;
        cleanup();
        onDone(new Error('load failed'));
      };
      s.src = API_URL + '?callback=' + cbName +
        (season ? '&season=' + encodeURIComponent(season) : '');
      document.body.appendChild(s);
    }

    function showError(msg) {
      document.getElementById('intro').textContent = msg;
      document.getElementById('gallery').innerHTML =
        '<p class="empty">' + esc(msg) + '</p>';
    }

    function render(season) {
      if (!API_URL || API_URL.indexOf('http') !== 0) {
        showError('아직 설정 전입니다. index.html의 API_URL에 Apps Script 주소를 넣어주세요.');
        return;
      }
      fetchGallery(season, function (err, res) {
        if (err || !res) {
          showError('작품을 불러오지 못했습니다. 잠시 후 다시 열어주세요.');
          return;
        }
        data = res;
        document.getElementById('intro').textContent =
          res.intro || '학생들이 직접 기획하고 만든 작품을 소개합니다.';
        renderSeasonBar();
        renderCards();
        // 캐러셀을 보는 동안 데이터가 도착했다면 시트 슬라이드로 다시 만듭니다.
        if (carouselVisible() && res.slides && res.slides.length) {
          buildCarousel();
        }
      });
    }

    function renderSeasonBar() {
      const bar = document.getElementById('seasonBar');
      if (!data.seasons || data.seasons.length <= 1) { bar.innerHTML = ''; return; }
      bar.innerHTML = data.seasons.map(s =>
        '<button data-season="' + esc(s) + '" class="' +
        (s === data.current ? 'on' : '') + '">' + esc(s) + '</button>'
      ).join('');
      bar.querySelectorAll('button').forEach(b =>
        b.addEventListener('click', () => render(b.dataset.season)));
    }

    // 썸네일 주소 정리: 일반 이미지 주소는 그대로 쓰고,
    // Google 드라이브 공유 링크(/file/d/... 또는 open?id=...)는
    // 갤러리가 바로 보여줄 수 있는 미리보기 주소로 바꿉니다.
    // (드라이브 파일은 "링크가 있는 모든 사용자에게 공개" 상태여야 합니다)
    function thumbUrl(u) {
      u = String(u || '').trim();
      if (!u) return '';
      var m = u.match(/drive\.google\.com\/file\/d\/([A-Za-z0-9_-]+)/);
      if (!m && u.indexOf('drive.google.com') >= 0) {
        m = u.match(/[?&]id=([A-Za-z0-9_-]+)/);
      }
      if (m) return 'https://lh3.googleusercontent.com/d/' + m[1] + '=w1200';
      return u;
    }

    // 시트의 i번째 줄이 i번 자리 카드입니다 (줄 순서 = 모둠 자리).
    // 모둠 이름 칸을 바꾸면 갤러리에도 그대로 반영되고,
    // 이름 칸이 비어 있으면 "n모둠"으로 표시합니다.
    // 링크가 아직 없는 자리는 "준비 중"으로 보입니다.
    function renderCards() {
      const g = document.getElementById('gallery');
      const works = data.works || [];
      const n = Math.max(10, works.length);
      const html = [];
      for (let i = 0; i < n; i++) {
        const w = works[i];
        const team = (w && w.team) ? w.team : (i + 1) + '모둠';
        if (!w || !w.link) {
          html.push('<article class="card pending">' +
            '<div class="body">' +
              '<div class="team">' + esc(team) + '</div>' +
              '<div class="title">준비 중</div>' +
              '<div class="desc">작품 링크가 등록되면 여기에 보입니다.</div>' +
            '</div>' +
          '</article>');
          continue;
        }
        html.push('<article class="card">' +
          (thumbUrl(w.thumb) ? '<img src="' + esc(thumbUrl(w.thumb)) + '" alt="" loading="lazy" referrerpolicy="no-referrer">' : '') +
          '<div class="body">' +
            '<div class="team">' + esc(team) + '</div>' +
            '<div class="title">' + esc(w.title || '작품') + '</div>' +
            '<div class="desc">' + esc(w.desc) + '</div>' +
            '<a class="view" href="' + esc(w.link) +
              '" target="_blank" rel="noopener">작품 보러가기</a>' +
          '</div>' +
        '</article>');
      }
      g.innerHTML = html.join('');
    }

    render();
  </script>

  <script>
    /* ============================================
       배경 음악: 오리지널 서스펜스 루프
       - 미션 임파서블 '느낌'만 참고 (5/4박자 저음 펄스 + 은은한 멜로디)
         실제 주제곡 멜로디/음원은 전혀 사용하지 않은 새 곡입니다.
       - 아이폰 무음(벨소리 끔) 스위치에서도 소리가 나도록,
         합성한 음악을 WAV로 미리 그려서 <audio> 태그로 재생합니다.
         (Web Audio API는 아이폰 무음 스위치에 음소거되지만,
          <audio> 미디어 재생은 무음 스위치와 상관없이 소리가 납니다.)
       - 브라우저 정책상 첫 터치/클릭 후에 시작됩니다.
       - 갤러리 화면에서는 볼륨이 낮아지고, 탭을 숨기면 일시정지합니다.
       - 오프라인 렌더가 안 되는 옛날 브라우저에서는 실시간 Web Audio로
         대체 재생합니다.
       ============================================ */
    (function () {
      const musicBtn = document.getElementById('musicBtn');
      const musicHint = document.getElementById('musicHint');
      const audioEl = document.getElementById('bgmAudio');
      let started = false, muted = false, resumeOnShow = false, pendingStart = false;
      let screenVol = 'high';
      let mode = 'none';              // 'element' | 'webaudio'
      let renderRms = 0, renderPeak = 0, renderErr = '';

      const BPM = 112;
      const EIGHTH = 60 / BPM / 2;      // 8분음표 길이(초), 한 마디(5/4) = 10개
      const LOOP_EIGHTHS = 40;          // 4마디 = 1루프
      const LOOP_LEN = LOOP_EIGHTHS * EIGHTH;
      // 저음 베이스 진행: A A F G (4마디 순환) - 오리지널
      const BASS_ROOTS = [55.00, 55.00, 43.65, 49.00];
      // 한 마디(10개의 8분음표) 안에서 베이스가 울리는 위치와 강세
      const BASS_HITS = { 0: 1.0, 3: 0.7, 5: 0.9, 7: 0.7, 8: 0.55 };
      // 은은한 '궁금증' 멜로디 (2,4마디에만): 오리지널 3음 구절
      const PLUCK_BARS = {
        1: [{ e: 0, f: 329.63 }, { e: 3, f: 293.66 }, { e: 6, f: 261.63 }],
        3: [{ e: 0, f: 392.00 }, { e: 3, f: 329.63 }, { e: 7, f: 293.66 }]
      };
      // 드론 주파수를 루프 길이의 정수배로 맞춰 루프 이음새가 안 들리게 함
      const DRONE_FREQS = [589, 596, 1183].map(function (k) { return k / LOOP_LEN; });
      // 화면별 볼륨 (element: 렌더된 WAV 재생 / webaudio: 실시간 합성 대체)
      const VOLS = {
        element:  { high: 0.85, low: 0.45 },
        webaudio: { high: 0.20, low: 0.09 }
      };

      /* ---- 신스 그래프: 라이브/오프라인 렌더 공용 ---- */
      function createSynth(context, master) {
        // 멜로디용 에코(딜레이) - 신비로운 울림
        const delay = context.createDelay(1.0);
        delay.delayTime.value = EIGHTH * 3;
        const fb = context.createGain(); fb.gain.value = 0.32;
        const wet = context.createGain(); wet.gain.value = 0.22;
        const delaySend = context.createGain(); delaySend.gain.value = 1;
        delaySend.connect(delay); delay.connect(fb); fb.connect(delay);
        delay.connect(wet); wet.connect(master);

        const nLen = Math.floor(context.sampleRate * 0.5);
        const noiseBuf = context.createBuffer(1, nLen, context.sampleRate);
        const nd = noiseBuf.getChannelData(0);
        for (let i = 0; i < nLen; i++) nd[i] = Math.random() * 2 - 1;

        function bassNote(t, freq, accent) {
          const o = context.createOscillator(); o.type = 'sawtooth'; o.frequency.value = freq;
          const flt = context.createBiquadFilter(); flt.type = 'lowpass';
          flt.frequency.setValueAtTime(420 + 500 * accent, t);
          flt.frequency.exponentialRampToValueAtTime(140, t + 0.22);
          flt.Q.value = 6;
          const g = context.createGain();
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.34 * accent, t + 0.012);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
          o.connect(flt); flt.connect(g); g.connect(master);
          o.start(t); o.stop(t + 0.3);
        }
        function kick(t) {
          const o = context.createOscillator(); o.type = 'sine';
          o.frequency.setValueAtTime(120, t);
          o.frequency.exponentialRampToValueAtTime(38, t + 0.16);
          const g = context.createGain();
          g.gain.setValueAtTime(0.5, t);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
          o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.25);
        }
        function hat(t, open) {
          const s = context.createBufferSource(); s.buffer = noiseBuf;
          const f = context.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
          const g = context.createGain();
          const dur = open ? 0.09 : 0.035;
          g.gain.setValueAtTime(open ? 0.06 : 0.045, t);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          s.connect(f); f.connect(g); g.connect(master);
          s.start(t); s.stop(t + dur + 0.02);
        }
        function pluck(t, freq) {
          const o = context.createOscillator(); o.type = 'triangle'; o.frequency.value = freq;
          const g = context.createGain();
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.16, t + 0.008);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
          o.connect(g); g.connect(master); g.connect(delaySend);
          o.start(t); o.stop(t + 0.55);
        }
        function scheduleEighth(t, idx) {
          const inBar = idx % 10;          // 5/4 마디 안 위치
          const bar = Math.floor(idx / 10) % 4;
          if (BASS_HITS[inBar] !== undefined) bassNote(t, BASS_ROOTS[bar], BASS_HITS[inBar]);
          if (inBar === 0 || inBar === 6) kick(t);          // 1박·4박 쿵
          if (inBar % 2 === 1) hat(t, inBar === 7);         // 엇박 챙챙
          (PLUCK_BARS[bar] || []).forEach(function (n) { if (n.e === inBar) pluck(t, n.f); });
        }
        return { scheduleEighth: scheduleEighth };
      }

      // 아주 낮은 드론(공기감)
      function addDrones(context, master, t0, dur) {
        DRONE_FREQS.forEach(function (f) {
          const o = context.createOscillator(); o.type = 'sine'; o.frequency.value = f;
          const g = context.createGain(); g.gain.value = 0.022;
          o.connect(g); g.connect(master); o.start(t0);
          if (isFinite(dur)) o.stop(t0 + dur);
        });
      }

      /* ---- WAV 인코딩 (16bit PCM mono → data URI) ---- */
      function wavDataUri(samples, sampleRate, scale) {
        const n = samples.length;
        const buf = new ArrayBuffer(44 + n * 2);
        const v = new DataView(buf);
        function wstr(o, s) { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
        wstr(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); wstr(8, 'WAVE');
        wstr(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
        v.setUint16(22, 1, true); v.setUint32(24, sampleRate, true);
        v.setUint32(28, sampleRate * 2, true); v.setUint16(32, 2, true);
        v.setUint16(34, 16, true); wstr(36, 'data'); v.setUint32(40, n * 2, true);
        for (let i = 0; i < n; i++) {
          const s = Math.max(-1, Math.min(1, samples[i] * scale));
          v.setInt16(44 + i * 2, s < 0 ? s * 32768 : s * 32767, true);
        }
        const bytes = new Uint8Array(buf);
        let bin = '';
        const CH = 0x8000;
        for (let i = 0; i < bytes.length; i += CH) {
          bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
        }
        return 'data:audio/wav;base64,' + btoa(bin);
      }

      /* ---- 오프라인 렌더: 8마디를 그리고 뒤 4마디를 루프로 사용 ----
         (앞 4마디로 에코 상태가 안정된 뒤 구간을 잘라내므로 이음새가 깨끗함) */
      function renderLoop() {
        const SR = 44100;
        const total = LOOP_LEN * 2;
        const Off = window.OfflineAudioContext || window.webkitOfflineAudioContext;
        if (!Off) return Promise.reject(new Error('OfflineAudioContext 없음'));
        const off = new Off(1, Math.ceil(total * SR), SR);
        const master = off.createGain(); master.gain.value = 1;
        master.connect(off.destination);
        const synth = createSynth(off, master);
        addDrones(off, master, 0, total);
        const n = Math.round(total / EIGHTH);
        for (let i = 0; i < n; i++) synth.scheduleEighth(i * EIGHTH, i);
        return off.startRendering().then(function (buf) {
          const d = buf.getChannelData(0);
          const start = Math.floor(LOOP_LEN * SR);
          const len = Math.floor(LOOP_LEN * SR);
          const seg = d.slice(start, start + len);
          let peak = 0, sum = 0;
          for (let i = 0; i < seg.length; i++) {
            const a = Math.abs(seg[i]);
            if (a > peak) peak = a;
            sum += seg[i] * seg[i];
          }
          renderPeak = peak;
          renderRms = Math.sqrt(sum / seg.length);
          const scale = peak > 0 ? Math.min(1, 0.89 / peak) : 1;
          audioEl.src = wavDataUri(seg, SR, scale);
          mode = 'element';
        });
      }

      /* ---- 대체 경로: 실시간 Web Audio (오프라인 렌더가 안 될 때) ---- */
      let ctx = null, liveMaster = null, liveSynth = null;
      let schedTimer = null, nextEighth = 0, eighthIdx = 0;
      function initLive() {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        liveMaster = ctx.createGain(); liveMaster.gain.value = 0;
        liveMaster.connect(ctx.destination);
        liveSynth = createSynth(ctx, liveMaster);
        addDrones(ctx, liveMaster, ctx.currentTime, Infinity);
      }
      function liveTick() {
        if (!ctx) return;
        while (nextEighth < ctx.currentTime + 0.18) {
          liveSynth.scheduleEighth(nextEighth, eighthIdx);
          nextEighth += EIGHTH;
          eighthIdx++;
        }
      }

      function showHint() { musicHint.classList.add('show'); musicBtn.classList.add('attn'); }
      function hideHint() { musicHint.classList.remove('show'); musicBtn.classList.remove('attn'); }
      function refreshBtn() {
        musicBtn.textContent = muted ? '🔇' : '🎵';
        musicBtn.setAttribute('aria-pressed', muted ? 'false' : 'true');
      }
      function volNow() { return VOLS[mode === 'webaudio' ? 'webaudio' : 'element'][screenVol]; }
      function applyVolume(screen) {
        screenVol = screen;
        const v = volNow();
        if (mode === 'element') audioEl.volume = v;
        else if (mode === 'webaudio' && ctx && !muted) {
          liveMaster.gain.cancelScheduledValues(ctx.currentTime);
          liveMaster.gain.setTargetAtTime(v, ctx.currentTime, 0.4);
        }
      }
      function tryElementPlay() {
        const p = audioEl.play();
        if (p && p.catch) p.catch(function () { showHint(); });
        return p;
      }

      function start() {
        if (started) return;
        if (mode === 'element' && audioEl.src) {
          audioEl.volume = volNow();
          audioEl.muted = false;
          const p = tryElementPlay();
          if (p && p.then) {
            p.then(function () { started = true; hideHint(); refreshBtn(); });
          } else {
            started = true; hideHint(); refreshBtn();
          }
        } else if (mode === 'webaudio') {
          if (!ctx) {
            initLive();
            nextEighth = ctx.currentTime + 0.06;
            schedTimer = setInterval(liveTick, 40);
          }
          ctx.resume();
          liveMaster.gain.cancelScheduledValues(ctx.currentTime);
          liveMaster.gain.setTargetAtTime(muted ? 0.0001 : volNow(), ctx.currentTime, 0.3);
          started = true; hideHint(); refreshBtn();
        } else {
          pendingStart = true;   // 렌더가 끝나면 다시 시도
          showHint();
        }
      }

      // 첫 터치/클릭 어디든 음악 시작 (브라우저 자동재생 정책)
      // - 🎵 버튼 위 첫 탭은 버튼 핸들러에 맡김 (첫 탭 = 켜기)
      // - 시작 후 시스템(전화 등)이 멈춘 경우 아무 탭이나 재개
      function onGesture(e) {
        if (muted) return;
        if (!started) {
          if (e.target && e.target.closest && e.target.closest('#musicBtn')) return;
          start();
        } else if (mode === 'element' && audioEl.paused && !document.hidden) {
          tryElementPlay();
        }
      }
      ['pointerdown', 'touchend', 'click'].forEach(function (ev) {
        document.addEventListener(ev, onGesture, { capture: true });
      });

      // 화면별 볼륨: 갤러리에서는 낮게, 첫 화면/설명에서는 기본
      document.getElementById('enterBtn').addEventListener('click', function () { applyVolume('low'); });
      document.getElementById('homeBtn').addEventListener('click', function () { applyVolume('high'); });

      // 음악 버튼: 시작 전 첫 탭은 '켜기', 이후에는 켜기/끄기
      musicBtn.addEventListener('click', function () {
        if (!started) {
          muted = false;
          start();
          refreshBtn();
          return;
        }
        muted = !muted;
        if (mode === 'element') {
          audioEl.muted = muted;
          if (!muted && audioEl.paused) tryElementPlay();
        } else if (mode === 'webaudio' && ctx) {
          if (muted) {
            liveMaster.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.15);
          } else {
            if (ctx.state === 'suspended') ctx.resume();
            liveMaster.gain.setTargetAtTime(volNow(), ctx.currentTime, 0.15);
          }
        }
        refreshBtn();
      });

      // 탭이 숨겨지면 일시정지, 돌아오면 다시 재생
      document.addEventListener('visibilitychange', function () {
        if (!started) return;
        if (document.hidden) {
          resumeOnShow = false;
          if (mode === 'element') {
            resumeOnShow = !audioEl.paused && !muted;
            audioEl.pause();
          } else if (mode === 'webaudio' && ctx && ctx.state === 'running') {
            resumeOnShow = true;
            ctx.suspend();
          }
        } else if (resumeOnShow) {
          resumeOnShow = false;
          if (mode === 'element') tryElementPlay();
          else if (mode === 'webaudio' && ctx && !muted) ctx.resume();
        }
      });

      // 검증용 상태 확인
      window.__bgm = {
        state: function () {
          return {
            started: started, muted: muted, mode: mode, screenVol: screenVol,
            ctxState: ctx ? ctx.state : 'none',
            elSrcBytes: audioEl.src ? audioEl.src.length : 0,
            elPaused: audioEl.paused, elTime: audioEl.currentTime,
            elVolume: audioEl.volume,
            renderRms: renderRms, renderPeak: renderPeak, renderErr: renderErr,
            hintShown: musicHint.classList.contains('show')
          };
        }
      };

      // 초기 상태: 탭하면 재생된다는 안내를 보여 줌
      showHint();
      refreshBtn();
      // 페이지를 열자마자 음악 렌더 시작 (소리는 안 남, 제스처 불필요)
      renderLoop().then(function () {
        if (pendingStart && !started && !muted) start();
      }).catch(function (e) {
        renderErr = String((e && e.message) || e);
        mode = 'webaudio';
      });
    })();

  </script>
</body>
</html>
